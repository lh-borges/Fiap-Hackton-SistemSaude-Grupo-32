services:
  postgres:
    image: postgres:16-alpine
    container_name: sus-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-sus}
      POSTGRES_USER: ${DB_USER:-sus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sus}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sus} -d ${DB_NAME:-sus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Necessario a partir do modulo de notificacoes (009). A aplicacao sobe sem ele.
  kafka:
    image: apache/kafka:3.9.0
    container_name: sus-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  api:
    build: .
    container_name: sus-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-sus}
      DB_USER: ${DB_USER:-sus}
      DB_PASSWORD: ${DB_PASSWORD:-sus}
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-de-desenvolvimento-com-no-minimo-32-chars}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-28800000}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@sus.gov.br}
      SEED_ADMIN_SENHA: ${SEED_ADMIN_SENHA:-Admin@123}
      SEED_ADMIN_CPF: ${SEED_ADMIN_CPF:-52998224725}

volumes:
  postgres-data:
